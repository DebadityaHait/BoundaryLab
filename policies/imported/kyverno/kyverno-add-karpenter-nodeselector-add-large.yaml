# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-add-karpenter-nodeselector-add-large
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/llm-confidence: medium
        kyverno.io/category: Karpenter, EKS Best Practices
spec:
    description: Selecting the correct Node(s) provisioned by Karpenter is a way to specify the appropriate resource landing zone for a workload. This policy injects a nodeSelector map into the Pod based on the Namespace type where it is deployed.
    matchConstraints:
        tools: []
    validations:
        - expression: 'false'
          message: 'Mutate rule (Karpenter nodeSelector injection) — BoundaryLab cannot mutate requests; verify pods in production namespaces include appropriate nodeSelector for large Karpenter nodes'
          action: AUDIT
    defaultAction: ALLOW
