# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-require-tekton-bundle-check-bundle-taskrun-taskrun
    annotations:

        boundarylab.io/severity: medium
        kyverno.io/category: Tekton
spec:
    description: PipelineRun and TaskRun resources must be executed from a bundle
    matchConstraints:
        tools:
            - Write
            - Edit
    validations:
        - expression: '(tool == "Write" || tool == "Edit") && request.args.path.matches(".*\\.(yaml|yml|json)$") && request.args.content.contains("kind: TaskRun")'
          message: 'TaskRun resources must be executed from a bundle — verify spec.taskRef.bundle (deprecated) or resolver: bundles is set; CEL cannot check field path'
          action: AUDIT
    defaultAction: ALLOW
