# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-restrict-networkpolicy-empty-podselector-empty-podselector-networkpolicy
    annotations:

        boundarylab.io/severity: medium
        kyverno.io/category: Other, Multi-Tenancy
spec:
    description: By default, all pods in a Kubernetes cluster are allowed to communicate with each other, and all network traffic is unencrypted. It is recommended to not use an empty podSelector in order to more closely control the necessary traffic flows. This policy requires that all NetworkPolicies other than that of `default-deny` not use an empty podSelector.
    matchConstraints:
        tools:
            - Write
            - Edit
    validations:
        - expression: '(tool == "Write" || tool == "Edit") && request.args.path.matches(".*\\.(yaml|yml|json)$") && request.args.content.contains("kind: NetworkPolicy") && request.args.content.contains("podSelector: {}") && !request.args.content.contains("default-deny")'
          message: 'NetworkPolicies must not use an empty podSelector except in explicitly named default-deny policies'
          action: DENY
    defaultAction: ALLOW
