# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-set-karpenter-non-cpu-limits-set-ephemeral-storage
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/llm-confidence: medium
        kyverno.io/category: Karpenter, EKS Best Practices
spec:
    description: For correct node provisioning Karpenter should know exactly what the non-CPU resources are that the pods will need. Otherwise Karpenter will put as many pods on a node as possible, which may lead to memory pressure on nodes. This is especially important in consolidation mode.
    matchConstraints:
        tools: []
    validations:
        - expression: 'false'
          message: 'Mutate rule — BoundaryLab does not mutate requests — manual review required'
          action: AUDIT
    defaultAction: ALLOW
