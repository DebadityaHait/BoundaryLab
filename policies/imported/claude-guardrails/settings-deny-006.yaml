# imported from: claude-guardrails
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: settings-deny-006
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/source-rule: Read ~/.config/gcloud/**
spec:
    description: 'Deny rule imported from settings.json: Read ~/.config/gcloud/**'
    matchConstraints:
        tools: [Read]
    validations:
        - expression: tool == "Read" && request.args.path.matches(".*/\\.config/gcloud/.*")
          message: 'Blocked by imported settings.json rule: Read ~/.config/gcloud/**'
          action: DENY
    defaultAction: ALLOW
