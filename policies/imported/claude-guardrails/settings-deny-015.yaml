# imported from: claude-guardrails
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: settings-deny-015
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/source-rule: Edit ~/.claude/settings.json
spec:
    description: 'Deny rule imported from settings.json: Edit ~/.claude/settings.json'
    matchConstraints:
        tools: [Edit, Write]
    validations:
        - expression: (tool == "Edit" || tool == "Write") && request.args.path.matches(".*/\\.claude/settings\\.json$")
          message: 'Blocked by imported settings.json rule: Edit ~/.claude/settings.json'
          action: DENY
    defaultAction: ALLOW
