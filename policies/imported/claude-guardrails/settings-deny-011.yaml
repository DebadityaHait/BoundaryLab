apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: settings-deny-011
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/source-rule: Read **/*.key
spec:
    description: 'Deny rule imported from settings.json: Read **/*.key'
    matchConstraints:
        tools: [Read]
    validations:
        - expression: tool == "Read" && request.args.path.matches(".*\\.key$")
          message: 'Blocked by imported settings.json rule: Read **/*.key'
          action: DENY
    defaultAction: ALLOW
