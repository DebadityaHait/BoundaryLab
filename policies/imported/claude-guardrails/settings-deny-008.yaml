apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: settings-deny-008
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/source-rule: Read **/.env
spec:
    description: 'Deny rule imported from settings.json: Read **/.env'
    matchConstraints:
        tools: [Read]
    validations:
        - expression: tool == "Read" && request.args.path.matches(".*\\.env$")
          message: 'Blocked by imported settings.json rule: Read **/.env'
          action: DENY
    defaultAction: ALLOW
