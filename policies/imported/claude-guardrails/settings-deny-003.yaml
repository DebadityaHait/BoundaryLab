# imported from: claude-guardrails
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: settings-deny-003
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/source-rule: Read ~/.gnupg/**
spec:
    description: 'Deny rule imported from settings.json: Read ~/.gnupg/**'
    matchConstraints:
        tools: [Read]
    validations:
        - expression: tool == "Read" && request.args.path.matches(".*/\\.gnupg/.*")
          message: 'Blocked by imported settings.json rule: Read ~/.gnupg/**'
          action: DENY
    defaultAction: ALLOW
