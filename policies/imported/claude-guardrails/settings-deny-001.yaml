# imported from: claude-guardrails
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: settings-deny-001
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/source-rule: Read ~/.ssh/**
spec:
    description: 'Deny rule imported from settings.json: Read ~/.ssh/**'
    matchConstraints:
        tools: [Read]
    validations:
        - expression: tool == "Read" && request.args.path.matches(".*/\\.ssh/.*")
          message: 'Blocked by imported settings.json rule: Read ~/.ssh/**'
          action: DENY
    defaultAction: ALLOW
