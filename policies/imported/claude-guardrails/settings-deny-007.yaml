# imported from: claude-guardrails
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: settings-deny-007
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/source-rule: Read ~/.docker/config.json
spec:
    description: 'Deny rule imported from settings.json: Read ~/.docker/config.json'
    matchConstraints:
        tools: [Read]
    validations:
        - expression: tool == "Read" && request.args.path.matches(".*/\\.docker/config\\.json")
          message: 'Blocked by imported settings.json rule: Read ~/.docker/config.json'
          action: DENY
    defaultAction: ALLOW
