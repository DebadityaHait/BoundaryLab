apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: settings-deny-027
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/source-rule: Read ~/.electrum/**
spec:
    description: 'Deny rule imported from settings.json: Read ~/.electrum/**'
    matchConstraints:
        tools: [Read]
    validations:
        - expression: tool == "Read" && request.args.path.matches(".*/\\.electrum/.*")
          message: 'Blocked by imported settings.json rule: Read ~/.electrum/**'
          action: DENY
    defaultAction: ALLOW
