# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-add-imagepullsecrets-add-imagepullsecret
    annotations:

        boundarylab.io/severity: low
        boundarylab.io/llm-confidence: medium
        kyverno.io/category: Sample
spec:
    description: Images coming from certain registries require authentication in order to pull them, and the kubelet uses this information in the form of an imagePullSecret to pull those images on behalf of your Pod. This policy searches for images coming from a registry called `corp.reg.com` and, if found, will mutate the Pod to add an imagePullSecret called `my-secret`.
    matchConstraints:
        tools: []
    validations:
        - expression: 'false'
          message: 'Mutate rule (imagePullSecret injection) — BoundaryLab cannot mutate requests; verify pods pulling from corp.reg.com include imagePullSecrets referencing my-secret'
          action: AUDIT
    defaultAction: ALLOW
