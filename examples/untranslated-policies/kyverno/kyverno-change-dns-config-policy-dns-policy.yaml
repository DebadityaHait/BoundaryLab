# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-change-dns-config-policy-dns-policy
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/llm-confidence: medium
        kyverno.io/category: Other
spec:
    description: The Default DNS policy in Kubernetes gives the flexibility of service  access; however, it costs some latency on a high scale, and it needs to  be optimized. This policy helps us to optimize the performance of DNS  queries by setting DNS Options, nodelocalDNS IP, and search Domains. This policy can be applied for the clusters provisioned by kubeadm.
    matchConstraints:
        tools: []
    validations:
        - expression: 'false'
          message: 'Mutate rule (DNS policy optimization) — BoundaryLab cannot mutate requests; verify high-throughput pods set dnsPolicy to ClusterFirstWithHostNet for DNS latency optimization'
          action: AUDIT
    defaultAction: ALLOW
