# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-add-tolerations-service-toleration
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/llm-confidence: medium
        kyverno.io/category: Other
spec:
    description: Pod tolerations are used to schedule on Nodes which have a matching taint. This policy adds the toleration `org.com/role=service:NoSchedule` if existing tolerations do not contain the key `org.com/role`.
    matchConstraints:
        tools: []
    validations:
        - expression: 'false'
          message: 'Mutate rule (toleration injection) — BoundaryLab cannot mutate requests; verify pods that should tolerate org.com/role=service:NoSchedule nodes define the toleration explicitly'
          action: AUDIT
    defaultAction: ALLOW
