# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-advertise-node-extended-resources-advertise-dongle
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/llm-confidence: medium
        kyverno.io/category: Other
spec:
    description: Kubernetes Nodes, in addition to standard compute resources like CPU and memory, may offer extended resources such as FPGAs and GPUs, both of which can be defined per custom design. These extended resources are advertised in the `status` object of a Node. This policy, functional only starting in Kyverno 1.9, adds the extended resource `example.com/dongle` with a value/capacity of `2` to Kubernetes Nodes.
    matchConstraints:
        tools: []
    validations:
        - expression: 'false'
          message: 'Mutate rule (Node extended resource advertisement) — BoundaryLab cannot mutate requests; verify nodes exposing example.com/dongle extended resources have the capacity configured via NodePatch'
          action: AUDIT
    defaultAction: ALLOW
