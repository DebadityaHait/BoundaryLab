# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-add-capabilities-add-setfcap-setuid
    annotations:

        boundarylab.io/severity: low
        boundarylab.io/llm-confidence: medium
        kyverno.io/category: PSP Migration
spec:
    description: In the earlier Pod Security Policy controller, it was possible to configure a policy to add capabilities to containers within a Pod. This made it easier to assign some basic defaults rather than blocking Pods or to simply provide capabilities for certain workloads if not specified. This policy mutates Pods to add the capabilities SETFCAP and SETUID so long as they are not listed as dropped capabilities first.
    matchConstraints:
        tools: []
    validations:
        - expression: 'false'
          message: 'Mutate rule (add SETFCAP/SETUID capabilities) — BoundaryLab cannot mutate requests; verify PSP migration policy is handled by cluster admission controller'
          action: AUDIT
    defaultAction: ALLOW
