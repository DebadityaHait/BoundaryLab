# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-add-default-securitycontext-add-default-securitycontext
    annotations:

        boundarylab.io/severity: low
        boundarylab.io/llm-confidence: medium
        kyverno.io/category: Sample
spec:
    description: A Pod securityContext entry defines fields such as the user and group which should be used to run the Pod. Sometimes choosing default values for users rather than blocking is a better alternative to not impede such Pod definitions. This policy will mutate a Pod to set `runAsNonRoot`, `runAsUser`, `runAsGroup`, and  `fsGroup` fields within the Pod securityContext if they are not already set.
    matchConstraints:
        tools: []
    validations:
        - expression: 'false'
          message: 'Mutate rule (default securityContext) — BoundaryLab cannot mutate requests; verify pods define runAsNonRoot, runAsUser, runAsGroup, and fsGroup in securityContext'
          action: AUDIT
    defaultAction: ALLOW
