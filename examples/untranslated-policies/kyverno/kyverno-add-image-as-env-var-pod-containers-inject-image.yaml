# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-add-image-as-env-var-pod-containers-inject-image
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/llm-confidence: medium
        kyverno.io/category: Other
spec:
    description: The Kubernetes downward API only has the ability to express so many options as environment variables. The image consumed in a Pod is commonly needed to make the application aware of some logic it must take. This policy takes the value of the `image` field and adds it as an environment variable to Pods.
    matchConstraints:
        tools: []
    validations:
        - expression: 'false'
          message: 'Mutate rule (inject image as env var) — BoundaryLab cannot mutate requests; verify pods have IMAGE_TAG env var set if the application requires image awareness'
          action: AUDIT
    defaultAction: ALLOW
