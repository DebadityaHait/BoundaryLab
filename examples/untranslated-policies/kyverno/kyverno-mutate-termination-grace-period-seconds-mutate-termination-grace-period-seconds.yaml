# imported from: policies
apiVersion: boundarylab.io/v1
kind: PolicyTemplate
metadata:
    name: kyverno-mutate-termination-grace-period-seconds-mutate-termination-grace-period-seconds
    annotations:

        boundarylab.io/severity: medium
        boundarylab.io/llm-confidence: medium
        kyverno.io/category: Sample
spec:
    description: Pods with large terminationGracePeriodSeconds (tGPS) might prevent cluster nodes from getting drained, ultimately making the whole cluster unstable. This policy mutates all incoming Pods to set their tGPS under 50s. If the user creates a pod without specifying tGPS, then the Kubernetes default of 30s is maintained.
    matchConstraints:
        tools: []
    validations:
        - expression: 'false'
          message: 'Mutate rule — BoundaryLab does not mutate requests — manual review required'
          action: AUDIT
    defaultAction: ALLOW
